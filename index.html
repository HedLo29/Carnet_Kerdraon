<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Carnet des marées</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon:ital@0;1&family=IM+Fell+French+Canon+SC&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap">
<style>
/* Mise en page : un carnet à l'italienne (format paysage), posé sous la lampe ; quatre fragments par page sur grand écran, deux sur téléphone. */
:root{
  --desk:#15100c; --desk-2:#2a1e15;
  --paper:#efe5cf; --paper-2:#e0cfac; --ink:#2b2118; --ink-soft:#5f4f3c; --ink-red:#8b3a2a;
  --gold:#8a7a52; --gold-bright:#cdb070;
  --leather:#1d3331; --leather-2:#132322; --wax:#7b2d2d;
  --abyss:#02121a; --abyss-2:#06324a; --neon:#2ff3ff; --neon-rim:#0a7d98;
  --f-display:"IM Fell French Canon", "EB Garamond", Georgia, serif;
  --f-sc:"IM Fell French Canon SC", "IM Fell French Canon", Georgia, serif;
  --f-body:"EB Garamond", Garamond, Georgia, serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --book-h: 440px;
  color-scheme: dark;
}
@media (max-width: 679px){ :root{ --book-h: 500px; } }
body{ background:var(--desk); color:var(--paper); font-family:var(--f-body); font-size:16px; line-height:1.5; }
*,*::before,*::after{ box-sizing:border-box; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--neon); outline-offset:3px; border-radius:4px; }

.scene{
  position:relative; overflow-x:clip; isolation:isolate;
  padding-block:14px 14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(60% 55% at 50% 40%, rgba(243,199,122,.17), transparent 72%),
    repeating-linear-gradient(176deg, rgba(255,220,170,.025) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, var(--desk-2), var(--desk) 75%);
}
.window{
  position:absolute; z-index:-1; top:-60px; right:-70px; width:220px; aspect-ratio:1; max-width:100%; border-radius:50%; opacity:.55;
  background:
    linear-gradient(90deg, transparent calc(50% - 3px), rgba(20,14,10,.9) calc(50% - 3px) calc(50% + 3px), transparent calc(50% + 3px)),
    linear-gradient(0deg, transparent calc(50% - 3px), rgba(20,14,10,.9) calc(50% - 3px) calc(50% + 3px), transparent calc(50% + 3px)),
    radial-gradient(circle at 45% 60%, rgba(47,243,255,.38), rgba(0,90,140,.30) 45%, rgba(2,18,26,.95) 75%);
  box-shadow:0 0 0 9px #2b1f16, 0 0 0 12px #4a3624, 0 0 70px 10px rgba(0,136,255,.16);
}

/* ---------- Le carnet ---------- */
.book-wrap{ display:flex; justify-content:center; }
.book{ position:relative; width:min(780px, 100%); height:var(--book-h); perspective:2600px; isolation:isolate; touch-action:pan-y; }
.book::before{ content:""; position:absolute; inset:14px -6px -14px 12px; z-index:-2; background:rgba(0,0,0,.6); filter:blur(18px); border-radius:12px; }
.book::after{ content:""; position:absolute; z-index:-1; top:6px; bottom:6px; right:-6px; width:7px; border-radius:0 4px 4px 0; background:repeating-linear-gradient(180deg, #e8dcc2 0 2px, #bfae8a 2px 3px); }
.leaf{ position:absolute; inset:0; transform-origin:left center; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.55,.06,.28,1), visibility 0s linear 0s; }
.leaf.turned{ transform:rotateY(-178deg); visibility:hidden; transition:transform .9s cubic-bezier(.55,.06,.28,1), visibility 0s linear .9s; }
.face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:3px 10px 10px 3px; overflow:hidden; }
.back{ transform:rotateY(180deg); border-radius:10px 3px 3px 10px; background:linear-gradient(270deg, rgba(60,40,20,.3) 0, transparent 8%), var(--paper-2); }
.leaf.turned .back{ opacity:0; transition:opacity .3s .5s; }

.page{
  color:var(--ink); display:flex; flex-direction:column;
  padding:16px clamp(18px,4vw,34px) 12px clamp(26px,5vw,46px);
  background:
    linear-gradient(90deg, rgba(60,40,20,.28) 0, rgba(60,40,20,.07) 3%, transparent 7%),
    radial-gradient(120% 80% at 88% 8%, rgba(255,252,240,.55), transparent 60%),
    radial-gradient(60% 40% at 12% 100%, rgba(120,85,45,.18), transparent 70%),
    var(--paper);
  box-shadow:inset -1px 0 0 rgba(0,0,0,.12);
}
.runhead{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-family:var(--f-sc); font-size:.74rem; letter-spacing:.12em; color:var(--ink-soft); border-bottom:1px solid rgba(138,122,82,.45); padding-bottom:5px; margin-bottom:12px; }
.runhead strong{ font-family:var(--f-display); font-weight:400; font-style:italic; letter-spacing:0; font-size:1.12rem; color:var(--ink); }
.page-body{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding-right:4px; scrollbar-width:thin; scrollbar-color:var(--gold) transparent; }

/* fragments */
.frags{ display:grid; grid-template-columns:1fr 1fr; gap:16px 28px; align-content:start; }
.frags.one{ grid-template-columns:1fr; gap:18px; }
/* un fragment seul sur sa page : plus grand, centré dans la hauteur */
.frags.solo{ height:100%; align-content:center; max-width:34em; margin:0 auto; }
.frags.solo .frag{ grid-template-columns:4.4rem minmax(0,1fr); column-gap:14px; }
.frags.solo .num{ font-size:2.8rem; }
.frags.solo .salle{ font-size:.8rem; margin-bottom:6px; }
.frags.solo blockquote{ font-size:clamp(1.25rem, 3.2vw, 1.5rem); line-height:1.42; }
.frags.solo .c{ display:block; margin-top:8px; text-align:right; font-size:.85rem; }
.frag{ display:grid; grid-template-columns:3.1rem minmax(0,1fr); column-gap:10px; min-width:0; }
.frag .txt{ min-width:0; }
.frag .num{ font-family:var(--f-display); font-style:italic; color:var(--gold); font-size:1.75rem; line-height:1; min-width:2.2ch; text-align:right; padding-top:2px; }
.frag .salle{ font-family:var(--f-sc); font-size:.72rem; letter-spacing:.1em; color:var(--ink-soft); margin:0 0 2px; }
.frag blockquote{ margin:0; font-family:var(--f-display); font-style:italic; font-size:1.04rem; line-height:1.38; text-wrap:pretty; }
.frag blockquote.notes{ font-family:var(--f-body); font-style:normal; font-size:1rem; line-height:1.42; }
.frag .c{ font-family:var(--f-body); font-style:normal; font-size:.8rem; color:var(--ink-soft); white-space:nowrap; }
.frag .note{ margin:3px 0 0; font-family:var(--f-hand); font-size:1.12rem; line-height:1.15; color:var(--ink-red); rotate:-1.2deg; }

/* coin corné */
.dogear{ position:absolute; right:0; bottom:0; width:52px; height:52px; border:0; padding:0; cursor:pointer; background:transparent; }
.dogear::before{ content:""; position:absolute; right:0; bottom:0; width:26px; height:26px; background:linear-gradient(135deg, transparent 50%, #d6c59f 50%, #c4b089); box-shadow:-2px -2px 5px rgba(60,40,20,.25); border-top-left-radius:4px; transition:width .2s, height .2s; }
.dogear:hover::before, .dogear:focus-visible::before{ width:36px; height:36px; }

/* couverture */
.cover{
  border-radius:4px 12px 12px 4px; display:grid; place-items:center; text-align:center; padding:24px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.45) 0, rgba(0,0,0,.1) 4%, transparent 8%),
    radial-gradient(90% 70% at 70% 25%, rgba(255,255,255,.06), transparent 60%),
    linear-gradient(160deg, var(--leather), var(--leather-2));
}
.cover-frame{ position:absolute; inset:18px 18px 18px 30px; border:1px solid rgba(205,176,112,.55); border-radius:6px; box-shadow:inset 0 0 0 6px rgba(205,176,112,.12); }
.strap{ position:absolute; right:0; top:50%; translate:0 -50%; width:74px; height:46px; background:linear-gradient(180deg, #2a1c12, #1a110b); border-radius:6px 0 0 6px; box-shadow:0 2px 6px rgba(0,0,0,.5); }
.seal{ position:absolute; right:30px; top:50%; translate:0 -50%; width:58px; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%, #a54848, var(--wax) 55%, #4d1a1a); box-shadow:0 3px 8px rgba(0,0,0,.5); font-family:var(--f-display); font-style:italic; font-size:1.7rem; color:rgba(255,215,200,.55); }
.cover-inner{ position:relative; display:grid; gap:10px; justify-items:center; padding-right:56px; }
.cover small{ font-family:var(--f-sc); letter-spacing:.18em; font-size:.74rem; color:#b8a06a; }
.cover h2{ font-family:var(--f-display); font-style:italic; font-weight:400; font-size:clamp(2.2rem, 7vw, 3.2rem); line-height:1; margin:0; color:#e1c788; text-shadow:0 1px 0 rgba(0,0,0,.6); text-wrap:balance; }
.cover .author{ font-family:var(--f-sc); letter-spacing:.16em; font-size:.95rem; color:#d2b97d; margin:0; }
.open-btn{ margin-top:8px; background:transparent; border:1px solid rgba(205,176,112,.6); color:#e1c788; padding:8px 18px; border-radius:999px; font-family:var(--f-sc); letter-spacing:.12em; font-size:.82rem; cursor:pointer; }
.open-btn:hover{ background:rgba(205,176,112,.12); }

/* dernière page */
.final{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:22px; align-items:center; height:100%; }
.final.solo{ grid-template-columns:1fr; }
.final blockquote{ margin:0; font-family:var(--f-display); font-style:italic; font-size:1.12rem; line-height:1.45; text-wrap:pretty; }
.final .c{ margin:6px 0 0; text-align:right; font-size:.82rem; color:var(--ink-soft); }
.ref-box{ margin-top:14px; padding-top:10px; border-top:1px solid rgba(138,122,82,.4); font-size:.88rem; }
.ref-box p{ margin:0; }
.ref-label{ font-family:var(--f-sc); letter-spacing:.1em; font-size:.72rem; color:var(--ink-soft); margin-bottom:2px !important; }
.ref{ padding-left:2em; text-indent:-2em; }
.ref-note{ font-family:var(--f-hand); font-size:1.1rem; color:var(--ink-red); line-height:1.15; margin-top:4px !important; }
.badge-col{ display:grid; justify-items:center; gap:2px; }
.ecrin{
  --coin:150px; position:relative; width:100%; max-width:280px; height:calc(var(--coin) + 46px); border-radius:14px; perspective:900px; cursor:grab; touch-action:none; user-select:none;
  background:radial-gradient(70% 70% at 50% 42%, var(--abyss-2), var(--abyss) 75%);
  box-shadow:inset 0 2px 14px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.4); display:grid; place-items:center;
}
.ecrin:active{ cursor:grabbing; }
.coin{ position:relative; width:var(--coin); height:var(--coin); transform-style:preserve-3d; translate:0 -8px; will-change:transform; }
.rim, .coin-face{ position:absolute; inset:0; border-radius:50%; }
.rim{ background:radial-gradient(circle, #0fb8d8 0, var(--neon-rim) 70%, #064a5c 100%); }
.coin-face{ backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; box-shadow:0 0 16px rgba(47,243,255,.6), 0 0 44px rgba(0,136,255,.35), inset 0 0 22px rgba(47,243,255,.32); }
.coin-face svg{ display:block; width:100%; height:100%; }
.coin-face::after{ content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; mix-blend-mode:screen; background:linear-gradient(105deg, transparent 38%, rgba(210,255,255,.38) 50%, transparent 62%); background-size:300% 100%; background-position:calc(var(--sheen, .5) * 100%) 0; }
.coin-face.front{ transform:translateZ(6px); }
.coin-face.reverse{ transform:rotateY(180deg) translateZ(6px); }
.coin-floor{ position:absolute; left:50%; bottom:11px; height:12px; width:calc(var(--coin) * var(--w, 1)); translate:-50% 0; border-radius:50%; background:radial-gradient(closest-side, rgba(47,243,255,.55), rgba(0,136,255,.15) 60%, transparent); filter:blur(3px); }
.badge-title{ margin:6px 0 0; font-family:var(--f-display); font-size:1.45rem; line-height:1.1; text-align:center; }
.badge-sub{ margin:0; font-family:var(--f-sc); letter-spacing:.16em; font-size:.78rem; color:var(--neon-rim); text-align:center; }

/* commandes */
.controls{ display:flex; align-items:center; justify-content:center; gap:12px; margin:12px auto 0; max-width:780px; }
.ctl{ display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(205,176,112,.5); background:rgba(42,30,21,.75); color:#ead7aa; padding:6px 14px; border-radius:999px; cursor:pointer; font-size:.9rem; }
.ctl:hover:not(:disabled){ background:rgba(205,176,112,.16); }
.ctl:disabled{ opacity:.35; cursor:default; }
.ctl .arrow{ font-family:var(--f-display); font-size:1.2rem; line-height:1; }
.where{ flex:1; min-width:0; margin:0; text-align:center; color:#d8c8a8; font-size:.88rem; }
.where b{ font-family:var(--f-sc); font-weight:400; letter-spacing:.1em; color:var(--gold-bright); }

@media (max-width: 679px){
  .frags{ grid-template-columns:1fr; }
  .final{ grid-template-columns:1fr; }
  .cover-inner{ padding-right:44px; }
  .seal{ right:22px; width:50px; }
  .strap{ width:60px; }
  .ctl .lbl{ display:none; }
  .where{ font-size:.8rem; line-height:1.3; }
}
@media (prefers-reduced-motion: reduce){
  .leaf, .leaf.turned, .leaf.turned .back{ transition-duration:.01s !important; transition-delay:0s !important; }
}
</style>

<main class="scene">
  <div class="window" aria-hidden="true"></div>
  <div class="book-wrap">
    <div class="book" id="book" aria-roledescription="carnet" aria-label="Carnet des marées du Professeur Kerdraon"></div>
  </div>
  <nav class="controls" aria-label="Feuilleter le carnet">
    <button class="ctl" id="prev" type="button" aria-label="Page précédente"><span class="arrow" aria-hidden="true">‹</span><span class="lbl">Précédente</span></button>
    <p class="where" id="where" aria-live="polite"></p>
    <button class="ctl" id="next" type="button" aria-label="Page suivante"><span class="lbl">Suivante</span><span class="arrow" aria-hidden="true">›</span></button>
  </nav>
</main>

<script>
/* ===== Les fragments, regroupés par étape du parcours : modifiez ici les textes ou les salles ===== */
const GROUPS = [
  { titre:"Se repérer", folios:[
    { n:"III", salle:"Bibliothèque de Ker-Ys", text:"« Ceux qui entrent ici cherchent rarement un livre. Ils cherchent une réponse. »" },
    { n:"IV",  salle:"Accueil", text:"« Ce qui n'est pas enregistré n'existe pas. Ce qui est enregistré peut toujours être retrouvé. »" },
    { n:"V",   salle:"Rotonde des Échanges", text:"« Ce lieu se transforme selon les besoins : salle d'exposition, salle de conférence, ou simple refuge pour travailler, seul ou à plusieurs. »" },
    { n:"VI",  salle:"Archives de Ker-Ys", text:"« Tout ce qui a été écrit depuis un siècle se trouve ici. Encore faut-il savoir poser la bonne question, et apprendre où se trouve la bonne réponse. »" }
  ]},
  { titre:"Chercher et juger", folios:[
    { n:"VIII", salle:"Grande Nef des Codex", text:"« Un livre, un article de presse, un article de revue scientifique n'ont pas la même portée informationnelle, mais ils sont complémentaires. Confondre les trois, c'est perdre le fil de la vérité. »" },
    { n:"IX",   salle:"Scriptorium Nocturne", text:"« Le numérique n'a pas de couverture, pas de reliure, pas de cachet de cire. Il faut apprendre à juger une source sans pouvoir la tenir. »" },
    { n:"X",    salle:"Galerie des légendes", text:"« Une ressource qui ne répond pas n'est pas muette. C'est la question qui est mal posée. »" },
    { n:"XI",   salle:"Salon de lecture", text:"« Une source ne prouve rien par elle-même. C'est vous qui devez la mettre à l'épreuve. »" }
  ]},
  { titre:"Citer ses sources", folios:[
    { n:"XX", salle:"Chambre des Copies Interdites", text:"« On peut rendre un objet volé. Une idée qu'on a faite sienne sans en citer l'auteur, jamais. »" }
  ]}
];
const LAST_WORDS = "« Si vous lisez ces mots, c'est que vous avez tenu jusqu'au bout. Peu y parviennent. Les Archives n'ouvrent leurs secrets qu'à ceux qui savent les mériter. Vous êtes désormais des leurs. »";

const book = document.getElementById("book");
const where = document.getElementById("where");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const narrowMQ = matchMedia("(max-width: 679px)");
let pages = [], leaves = [], current = 0;

function buildPages(narrow){
  const list = [{ type:"cover", label:"Couverture", sub:"Le carnet est fermé", key:"cover" }];
  GROUPS.forEach((g, gi) => {
    const chunks = (narrow ? [g.folios.slice(0,2), g.folios.slice(2)] : [g.folios]).filter(ch => ch.length);
    chunks.forEach((ch, ci) => list.push({
      type:"frags", titre:g.titre, folios:ch, key:"g"+gi,
      label: g.titre + (chunks.length > 1 ? ` (${ci+1}/${chunks.length})` : ""),
      sub: ch.length > 1 ? `f° ${ch[0].n} à ${ch[ch.length-1].n}` : `f° ${ch[0].n}`
    }));
  });
  if(narrow){
    list.push({ type:"words", label:"Dernière page", sub:"Le mot du Professeur", key:"last" });
    list.push({ type:"badge", label:"Gardien·ne du Flot", sub:"Le jeu des Ker-Ys", key:"last" });
  } else {
    list.push({ type:"last", label:"Dernière page", sub:"Gardien·ne du Flot", key:"last" });
  }
  return list;
}

const RH = (left, right) => `<header class="runhead"><strong>${left}</strong><span>${right}</span></header>`;
const fragHTML = f => `
  <div class="frag">
    <span class="num" aria-hidden="true">${f.n}</span>
    <div class="txt">
      <p class="salle">${f.salle}</p>
      <blockquote class="${f.kind || ""}">${f.text} <span class="c">(Kerdraon, s.d., folio ${f.n})</span></blockquote>
      ${f.note ? `<p class="note">${f.note}</p>` : ""}
    </div>
  </div>`;
const wordsHTML = () => `
  <div>
    <blockquote>${LAST_WORDS}</blockquote>
    <p class="c">(Kerdraon, s.d., dernière page)</p>
    <div class="ref-box">
      <p class="ref-label">Référence du carnet</p>
      <p class="ref">Kerdraon, M. (s.d.). <em>Carnet des marées</em> [Manuscrit non publié]. Archives englouties, Bibliothèque de Ker-Ys.</p>
      <p class="ref-note">Neuf folios, un seul document : une seule référence.</p>
    </div>
  </div>`;
const badgeHTML = () => `
  <div class="badge-col">
    <div class="ecrin" id="stage" role="img" aria-label="Insigne bleu néon « Gardien·ne du Flot », Le jeu des Ker-Ys, qui tourne sur lui-même">
      <div class="coin" id="coin">${rimLayers()}
        <div class="coin-face front">${coinFront()}</div>
        <div class="coin-face reverse">${coinBack()}</div>
      </div>
      <div class="coin-floor" id="floor"></div>
    </div>
    <p class="badge-title">Gardien·ne du Flot</p>
    <p class="badge-sub">Le jeu des Ker-Ys</p>
  </div>`;

function faceHTML(p, i, n){
  const ear = i < n - 1 ? `<button class="dogear" type="button" data-turn aria-label="Tourner la page"></button>` : "";
  if(p.type === "cover") return `
    <div class="face cover">
      <div class="cover-frame" aria-hidden="true"></div>
      <div class="strap" aria-hidden="true"></div><div class="seal" aria-hidden="true">K</div>
      <div class="cover-inner">
        <small>Archives englouties · Bibliothèque de Ker-Ys</small>
        <h2>Carnet des marées</h2>
        <p class="author">Pr M. Kerdraon</p>
        <button class="open-btn" type="button" data-turn>Ouvrir le carnet</button>
      </div>
    </div>`;
  if(p.type === "frags") return `
    <div class="face page">
      ${RH(p.label, p.sub)}
      <div class="page-body"><div class="frags${p.folios.length < 3 ? " one" : ""}${p.folios.length === 1 ? " solo" : ""}">${p.folios.map(fragHTML).join("")}</div></div>
      ${ear}
    </div>`;
  if(p.type === "words") return `
    <div class="face page">${RH("Dernière page", "Carnet des marées")}<div class="page-body"><div class="final solo">${wordsHTML()}</div></div>${ear}</div>`;
  if(p.type === "badge") return `
    <div class="face page">${RH("Gardien·ne du Flot", "Carnet des marées")}<div class="page-body"><div class="final solo">${badgeHTML()}</div></div></div>`;
  return `
    <div class="face page">${RH("Dernière page", "Carnet des marées")}<div class="page-body"><div class="final">${wordsHTML()}${badgeHTML()}</div></div></div>`;
}

function rimLayers(){ let s = ""; for(let z = -5; z <= 5; z++) s += `<div class="rim" style="transform:translateZ(${z}px)"></div>`; return s; }
const NEON = "#2ff3ff";
function coinFront(){
  return `<svg viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="cfG" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#0c4c6e"/><stop offset=".7" stop-color="#03202e"/><stop offset="1" stop-color="#010d14"/></radialGradient>
      <filter id="cfGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <path id="cfRing" d="M100,100 m-79,0 a79,79 0 1,1 158,0 a79,79 0 1,1 -158,0"/>
    </defs>
    <circle cx="100" cy="100" r="100" fill="url(#cfG)"/>

/* ===== Construction et feuilletage ===== */
function render(keepKey){
  pages = buildPages(narrowMQ.matches);
  const N = pages.length;
  book.innerHTML = pages.map((p, i) => `
    <section class="leaf" data-i="${i}" aria-label="${p.label}">
      ${faceHTML(p, i, N)}
      <div class="face back" aria-hidden="true"></div>
    </section>`).join("");
  leaves = [...book.querySelectorAll(".leaf")];
  if(keepKey){ const k = pages.findIndex(p => p.key === keepKey); current = k < 0 ? 0 : k; }
  current = Math.min(current, N - 1);
  leaves.forEach(l => l.style.transition = "none");
  layout();
  requestAnimationFrame(() => leaves.forEach(l => l.style.transition = ""));
  bindCoin();
}
function layout(){
  const N = pages.length;
  leaves.forEach((l, i) => {
    l.classList.toggle("turned", i < current);
    if(!l.dataset.moving) l.style.zIndex = i < current ? i + 1 : (N * 2 - i);
    l.inert = i !== current;
    l.setAttribute("aria-hidden", i === current ? "false" : "true");
  });
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === N - 1;
  const p = pages[current];
  where.innerHTML = `<b>${p.label}</b> · ${p.sub} · ${current + 1}/${N}`;
  coinActive = !!book.querySelector(`.leaf[data-i="${current}"] #stage`);
}
function bump(i){
  const l = leaves[i]; if(!l) return;
  l.dataset.moving = "1"; l.style.zIndex = pages.length * 3;
  clearTimeout(l._t); l._t = setTimeout(() => { delete l.dataset.moving; layout(); }, 950);
}
function next(){ if(current < pages.length - 1){ bump(current); current++; layout(); } }
function prev(){ if(current > 0){ current--; bump(current); layout(); } }

prevBtn.addEventListener("click", prev);
nextBtn.addEventListener("click", next);
book.addEventListener("click", e => { if(e.target.closest("[data-turn]")) next(); });
document.addEventListener("keydown", e => { if(e.key === "ArrowRight") next(); if(e.key === "ArrowLeft") prev(); });
let sx = null, sy = 0;
book.addEventListener("pointerdown", e => { if(e.target.closest("#stage")) return; sx = e.clientX; sy = e.clientY; });
book.addEventListener("pointerup", e => {
  if(sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) dx < 0 ? next() : prev();
});
book.addEventListener("pointercancel", () => sx = null);
narrowMQ.addEventListener("change", () => render(pages[current] && pages[current].key));

/* ===== L'insigne en 3D ===== */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const BASE = reduce ? 0 : 42;
let coin, floor, angle = reduce ? 18 : -20, vel = BASE, dragging = false, lastX = 0, lastT = 0, prevT = performance.now(), coinActive = false;
function draw(){
  if(!coin) return;
  coin.style.transform = `rotateX(9deg) rotateY(${angle}deg)`;
  coin.style.setProperty("--sheen", ((((angle % 360) + 360) % 360) / 360).toFixed(3));
  floor.style.setProperty("--w", (0.35 + 0.65 * Math.abs(Math.cos(angle * Math.PI / 180))).toFixed(3));
}
function bindCoin(){
  const stage = document.getElementById("stage");
  coin = document.getElementById("coin"); floor = document.getElementById("floor");
  if(!stage) return;
  stage.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastT = performance.now(); vel = 0; stage.setPointerCapture(e.pointerId); e.stopPropagation(); });
  stage.addEventListener("pointermove", e => {
    if(!dragging) return;
    const now = performance.now(), dx = e.clientX - lastX, dt = Math.max(0.008, (now - lastT) / 1000);
    angle += dx * 0.7; vel = Math.max(-900, Math.min(900, (dx * 0.7) / dt)); lastX = e.clientX; lastT = now; draw();
  });
  stage.addEventListener("pointerup", e => { dragging = false; e.stopPropagation(); });
  stage.addEventListener("pointercancel", () => dragging = false);
  draw();
}
function frame(t){
  const dt = Math.min(0.05, (t - prevT) / 1000); prevT = t;
  if(coinActive && !dragging){ vel += (BASE - vel) * Math.min(1, dt * 1.4); angle += vel * dt; draw(); }
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);
</script>
